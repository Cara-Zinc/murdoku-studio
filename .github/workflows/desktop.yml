name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: ['codex/desktop-preview']
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install desktop dependencies
        run: python -m pip install -r murdoku-studio/desktop/requirements.txt
      - name: Test rules and desktop PDF engine
        run: |
          npm --prefix murdoku-studio run check
          node --test murdoku-studio/tests/*.test.mjs
          python -m unittest discover -s murdoku-studio/tests -p test_desktop.py
      - name: Build application
        run: python murdoku-studio/desktop/build.py
      - name: Verify frozen application on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/Murdoku Studio/Murdoku Studio.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Desktop smoke test failed' }
      - name: Verify frozen application on macOS
        if: runner.os == 'macOS'
        run: '"dist/Murdoku Studio.app/Contents/MacOS/Murdoku Studio" --smoke-test'
      - uses: actions/upload-artifact@v7
        with:
          name: Murdoku-Studio-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
